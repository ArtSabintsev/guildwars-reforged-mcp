name: Source Smoke

# Live smoke checks against every upstream source the server reads. Some
# public hosts intermittently 403 hosted-runner egress IPs (Guild Wars Wiki
# AWS ELB block windows, observed 2026-07-20; Reddit GitHub Actions / Azure
# datacenter IPs, observed 2026-09-18). A block window is external and
# self-heals, so it must not red the run:
#   - scripts/source-smoke.mjs exits 99 when every failing check is a wiki
#     or reddit HTTP 403;
#   - a failed first attempt retries once on a fresh runner (fresh IP);
#   - if both attempts land in a block window, the run skips green with a
#     warning and the next schedule retries. A genuine source regression
#     (parse failure, empty 200, non-403) exits 1 on both attempts and reds
#     the run as before.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * 2,5"

jobs:
  smoke:
    runs-on: ubuntu-latest
    # A first-attempt failure must not fail the run: the retry below may still
    # pass (fresh IP) or legitimately skip a block window.
    continue-on-error: true
    outputs:
      ok: ${{ steps.attempt.outputs.ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Source smoke
        id: attempt
        uses: ./.github/actions/source-smoke

  # Fresh runner = fresh egress IP; only runs when the first attempt failed.
  smoke-retry:
    needs: smoke
    if: needs.smoke.outputs.ok != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Source smoke (retry on fresh runner)
        uses: ./.github/actions/source-smoke
        with:
          # Second blocked attempt = we're in a block window; skip green and
          # let the next scheduled run retry rather than paging on a red X.
          blocked-policy: skip
